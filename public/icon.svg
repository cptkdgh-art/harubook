<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbb6ce"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="leaf" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff0f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </radialGradient>
  </defs>

  <!-- 배경: 둥근 사각 그라디언트 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 펼쳐진 책 형태 -->
  <g transform="translate(96 140)">
    <!-- 책 바닥 그림자 -->
    <ellipse cx="160" cy="250" rx="150" ry="14" fill="#000" opacity="0.15"/>

    <!-- 책 본체 -->
    <path d="M20 40 Q20 20 40 20 L140 20 Q160 20 160 40 L160 240 Q160 260 140 260 L40 260 Q20 260 20 240 Z"
          fill="#fff" stroke="#fff" stroke-width="4"/>
    <path d="M300 40 Q300 20 280 20 L180 20 Q160 20 160 40 L160 240 Q160 260 180 260 L280 260 Q300 260 300 240 Z"
          fill="#fff" stroke="#fff" stroke-width="4"/>

    <!-- 책 가운데 홈 -->
    <line x1="160" y1="20" x2="160" y2="260" stroke="#e879a8" stroke-width="3"/>

    <!-- 페이지 줄 (왼쪽) -->
    <line x1="40" y1="70" x2="140" y2="70" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="95" x2="130" y2="95" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="120" x2="140" y2="120" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>

    <!-- 페이지 줄 (오른쪽) -->
    <line x1="180" y1="70" x2="280" y2="70" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="95" x2="270" y2="95" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="280" y2="120" stroke="#fbb6ce" stroke-width="3" stroke-linecap="round"/>

    <!-- 하루나무 잎: 페이지 중앙 아래 -->
    <g transform="translate(100 150)">
      <!-- 트렁크 -->
      <rect x="52" y="70" width="16" height="30" rx="2" fill="#a1724f"/>
      <!-- 잎 뭉치 -->
      <circle cx="60" cy="50" r="30" fill="url(#leaf)"/>
      <circle cx="40" cy="58" r="16" fill="url(#leaf)" opacity="0.9"/>
      <circle cx="80" cy="58" r="16" fill="url(#leaf)" opacity="0.9"/>
      <!-- 꽃잎 점 -->
      <circle cx="55" cy="42" r="3" fill="#fff"/>
      <circle cx="68" cy="50" r="3" fill="#fff"/>
      <circle cx="45" cy="55" r="3" fill="#fff"/>
    </g>
  </g>

  <!-- 작은 반짝이 -->
  <circle cx="420" cy="120" r="5" fill="#fff" opacity="0.8"/>
  <circle cx="440" cy="150" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="90" cy="110" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="70" cy="80" r="3" fill="#fff" opacity="0.6"/>
</svg>
